# Builds, lints and tests the project with Bun on Node.js.
# The project is Bun-managed (bun.lock), so npm-based install/cache steps do not apply.

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
    - name: Install dependencies
      run: bun install --frozen-lockfile
    - name: Build
      run: bun run build
    - name: Apply formatting
      # AI Studio syncs sometimes land code that is not Prettier-formatted.
      # Apply the project's own formatting rules before linting so formatting
      # alone can never fail CI; real lint problems still fail the next step.
      run: bunx eslint . --fix
    - name: Lint
      run: bun run lint
    - name: Test
      run: bun run test
