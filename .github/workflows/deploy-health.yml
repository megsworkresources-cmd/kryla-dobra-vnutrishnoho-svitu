# Checks the production deployment (page, Supabase auth redirects and video
# streaming) every day and on demand. The script uses only Node.js built-ins,
# so no dependency install is needed.

name: Deploy health check

on:
  schedule:
    # Daily at 06:17 UTC; avoid the top of the hour when Actions is busiest.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          # This check installs no packages; skip npm cache autodetection.
          package-manager-cache: false
      - name: Check production
        env:
          # Public project URL; override with a repository variable if it changes.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ftqdpebplmucvnzyltry.supabase.co' }}
          # Lovable Cloud owns the backend; keep its published auth fallback valid too.
          LOVABLE_PUBLISHED_URL: https://kryla-dobra-vnutrishnoho-svitu.lovable.app
        run: node scripts/verify-deploy.mjs
      - name: Report failure
        # Runs even when checkout or setup failed, using GH_REPO instead of a worktree.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ github.sha }}
        run: |
          title="[deploy-health] Production check failed"
          body="$(printf '%s\n' \
            'The production deployment health check failed.' \
            '' \
            "- Run: $RUN_URL" \
            "- Trigger: $EVENT" \
            "- Commit: $COMMIT" \
            '- Site: https://kryla-dobra-vnutrishnoho-svitu.vercel.app' \
            '' \
            'Inspect the failed step in the run log. This issue is reused for consecutive failures; close it once the check is green.')"
          existing=$(gh issue list --state open --search 'deploy-health in:title' --json number,title --jq '.[] | select(.title == "[deploy-health] Production check failed") | .number' | head -n 1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --assignee "$ASSIGNEE"
          fi
