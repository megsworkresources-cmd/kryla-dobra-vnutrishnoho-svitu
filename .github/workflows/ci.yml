# Fast pull-request gate: reject service-role client imports, typecheck, test.
# Build, lint and formatting stay in the full Node.js CI workflow.
name: CI

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Guard, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          # The project installs with Bun; avoid setup-node's npm cache autodetection.
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Reject service-role Supabase client imports
        run: node scripts/no-service-role-client-guard.mjs
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: Test
        run: bun run test
