# Checks the production deployment (page, Supabase auth redirects and video
# streaming) every day and on demand. The script uses only Node.js built-ins,
# so no dependency install is needed.

name: Deploy health check

on:
  schedule:
    # Daily at 06:17 UTC; avoid the top of the hour when Actions is busiest.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Use Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          # This check installs no packages; skip npm cache autodetection.
          package-manager-cache: false
      - name: Check production
        env:
          # Public project URL; override with a repository variable if it changes.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ftqdpebplmucvnzyltry.supabase.co' }}
        run: node scripts/verify-deploy.mjs
