# Runs the real-WebKit film smoke suite (e2e/video-smoke.spec.ts) on GitHub's runners,
# where WebKit can actually launch with its system libraries. Locally the same suite
# needs `bun run test:e2e:install` first, which cannot be done on every machine.
#
# The suite targets the deployed site by default: the tests only read pages and play
# films, so nothing is written, and a runner needs no project env for Supabase.
# Point E2E_BASE_URL at a preview deployment, or unset it to let Playwright start the
# dev server itself (that needs the project's VITE_SUPABASE_* values in the job env).

name: WebKit film smoke

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CI: "true"
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'https://kryla-dobra-vnutrishnoho-svitu.vercel.app' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install WebKit and its system libraries
        run: bunx playwright install --with-deps webkit
      - name: Play the four recorded films in WebKit
        run: bun run test:e2e
      - name: Keep the report when a film fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
